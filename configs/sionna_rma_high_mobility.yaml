name: sionna_rma_high_mobility
description: Rural macro high-mobility profile for prediction-horizon and latency stress evaluation.
seed: 31
time:
  num_slots: 200
  tti_ms: 1.0
  warmup_slots: 10
nr:
  carrier_frequency_hz: 700.0e6
  bandwidth_hz: 10.0e6
  subcarrier_spacing_hz: 15.0e3
  num_ofdm_symbols: 14
  num_frequency_resources: 24
  duplex_mode: downlink
topology:
  scenario: rma
  num_rings: 1
  num_cells: 3
  sectors_per_cell: 3
  inter_site_distance_m: 1732.0
  cell_radius_m: 866.0
  min_bs_ut_distance_m: 50.0
  max_bs_ut_distance_m: 1500.0
  bs_height_m: 35.0
  min_ut_height_m: 1.5
  max_ut_height_m: 1.5
  indoor_probability: 0.1
ue:
  num_ues: 16
  scheduled_per_slot: 4
  min_velocity_mps: 15.0
  max_velocity_mps: 33.0
  traffic_model: scheduled_only
channel:
  model_family: tr38901
  model: rma
  los: auto
  normalize_channel: true
  use_3gpp_channel: true
  enable_pathloss: true
  enable_shadow_fading: true
scheduler:
  type: proportional_fair
  num_streams_per_ue: 1
  beta: 0.98
link_adaptation:
  enabled: true
  olla_enabled: true
  target_bler: 0.1
power_control:
  uplink: open_loop
  downlink: fair
  max_tx_power_dbm: 23.0
cple:
  csi_dim: 64
  history_len: 6
  deadline_ms: 10.0
  feedback_resource_units_per_request: 64
metadata:
  intended_use: high-mobility prediction horizon and latency stress test
  notes: Useful when evaluating prediction horizon sensitivity and tail latency.
